services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amopethouse
      POSTGRES_USER: amopethouse
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amopethouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: ./docker/php
    volumes:
      - ./api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  web:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "4200:4200"
    environment:
      - NG_CLI_ANALYTICS=false
    command: sh -c "if [ -f package.json ]; then npm install && npx ng serve --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.json; else sleep infinity; fi"

volumes:
  postgres_data:
